name: Nightly catalogue sync

# ADR-002 / ADR-008: refresh the curated catalog_index from TMDB, enrich new titles ("Worth it?"), and
# refresh cached IMDb ratings from OMDb (staggered). Also keeps Supabase Free from pausing: the first
# step pings health_probe() with the anon key only, independent of the TMDB secret (ADR-011 §5).
# Deterministic data processing only — no AI/LLM steps or secrets (PRD D15).
on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Discover + guardrails only: no OMDb/enrich/image budget, write nothing'
        type: boolean
        default: false
      only:
        description: 'Run a single step'
        type: choice
        options: [all, discover, enrich, imdb]
        default: all

permissions:
  contents: read

concurrency:
  group: nightly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # The first run backfills enrichment over several nights (SYNC_ENRICH_MAX per night at ~10 req/s).
    timeout-minutes: 60
    environment: production
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
      REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      CATALOG_MIN_RATING: ${{ vars.CATALOG_MIN_RATING || '6.5' }}
      CATALOG_MIN_VOTES_MOVIE: ${{ vars.CATALOG_MIN_VOTES_MOVIE || '200' }}
      CATALOG_MIN_VOTES_TV: ${{ vars.CATALOG_MIN_VOTES_TV || '100' }}
      # Hysteresis + TV genre exclusions must match the app's curation rule (ADR-003).
      CATALOG_KEEP_RATING: ${{ vars.CATALOG_KEEP_RATING }}
      CATALOG_EXCLUDE_TV_GENRES: ${{ vars.CATALOG_EXCLUDE_TV_GENRES || '10767,10763,10764' }}
      # Per-type floors (GAP-03); empty = the app defaults (movie 3000, tv 1000). The first run on an
      # empty catalogue only warns; run with dry_run first to see the real counts. The legacy
      # SYNC_GUARD_MIN variable, if set, applies to any type without its own value.
      SYNC_GUARD_MIN_MOVIE: ${{ vars.SYNC_GUARD_MIN_MOVIE }}
      SYNC_GUARD_MIN_TV: ${{ vars.SYNC_GUARD_MIN_TV }}
      SYNC_GUARD_MIN: ${{ vars.SYNC_GUARD_MIN }}
      SYNC_GUARD_MAX: ${{ vars.SYNC_GUARD_MAX || '25000' }}
      SYNC_GUARD_MAX_DELTA: ${{ vars.SYNC_GUARD_MAX_DELTA || '0.2' }}
      SYNC_ENRICH_MAX: ${{ vars.SYNC_ENRICH_MAX || '3000' }}
      SYNC_ENRICH_TTL_DAYS: ${{ vars.SYNC_ENRICH_TTL_DAYS || '30' }}
      CERTIFICATION_REGION: ${{ vars.CERTIFICATION_REGION || 'US' }}
      OMDB_DAILY_BUDGET: ${{ vars.OMDB_DAILY_BUDGET || '900' }}
      OMDB_HOT_COUNT: ${{ vars.OMDB_HOT_COUNT || '1000' }}
      OMDB_HOT_TTL_DAYS: ${{ vars.OMDB_HOT_TTL_DAYS || '7' }}
      OMDB_TTL_DAYS: ${{ vars.OMDB_TTL_DAYS || '30' }}
      # Max missing titles re-checked per night; more aborts the apply for a human to look at (F2).
      SYNC_RECHECK_MAX: ${{ vars.SYNC_RECHECK_MAX || '500' }}
    steps:
      - name: Keep-alive (Supabase Free pauses after ~7 idle days)
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "keep-alive skipped" && exit 0
          fi
          curl -fsS -X POST "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/rpc/health_probe" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H 'Content-Type: application/json' -d '{}' > /dev/null
          echo "keep-alive ok"
      - name: Skip when not configured
        id: guard
        run: |
          if [ -z "$TMDB_READ_TOKEN$TMDB_API_KEY" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Secrets not configured; skipping sync." && echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.skip != 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        if: steps.guard.outputs.skip != 'true'
      - name: Sync
        if: steps.guard.outputs.skip != 'true'
        run: >-
          npm run sync:catalog --
          ${{ inputs.dry_run && '--dry-run' || '' }}
          ${{ inputs.only && inputs.only != 'all' && format('--only={0}', inputs.only) || '' }}
